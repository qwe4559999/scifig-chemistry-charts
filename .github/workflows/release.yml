name: Build & Publish SciFigStudio Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Verify demos & QA
        run: |
          python -X utf8 scripts/run_scifig.py doctor
          python -X utf8 scripts/run_scifig.py render examples/demo_uvvis_spec.json -o examples/out --name DemoUV
          python -X utf8 scripts/run_scifig.py qa examples/demo_uvvis_spec.json --png examples/out/DemoUV.png
      - name: Build Windows Workbench & Skill zips
        run: python -X utf8 scripts/build_release.py --out-dir release_artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release_artifacts/*.zip

  build-unix-and-wheel:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux
          - os: macos-latest
            tag: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies & build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt build
      - name: Create portable archive & wheel/sdist
        run: |
          mkdir -p release_artifacts
          VERSION=$(python -c "import scifig; print(scifig.__version__)")
          chmod +x launch_workbench.sh
          tar -czf "release_artifacts/SciFigStudio-Workbench-v${VERSION}-${{ matrix.tag }}-portable.tar.gz" \
            --exclude='.git' --exclude='release_artifacts' --exclude='dist' --exclude='build' --exclude='__pycache__' .
          if [ "${{ matrix.tag }}" = "linux" ]; then
            python -m build --outdir release_artifacts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: unix-${{ matrix.tag }}-artifacts
          path: release_artifacts/*

  publish-release:
    needs: [build-windows, build-unix-and-wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## SciFigStudio Chemistry Charts & Interactive Workbench

            - **Zero-Install Windows Workbench**: Download `SciFigStudio-Workbench-*-win64.zip`, unzip, and double-click `SciFigStudio-Workbench.exe`.
            - **macOS / Linux Portable Archive**: Extract and run `./launch_workbench.sh`.
            - **Python Package / AI Skill**: Install via `pip install scifig_chemistry_charts-*.whl` or use `scifig-chemistry-charts-*-skill.zip`.
          files: all_artifacts/*
